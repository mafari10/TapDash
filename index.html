<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#8fd3ff">
<title>Tap Dash</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<canvas id="gl"></canvas>
<div id="hud"></div>
<div id="divider" class="hidden"></div>
<div id="count"></div>
<button id="mute" aria-label="Sound on/off">🔊</button>

<div id="menu" class="screen">
  <div class="card">
    <div class="logo"><span>T</span><span>A</span><span>P</span> <span>D</span><span>A</span><span>S</span><span>H</span></div>
    <p class="tagline">Tap to jump. Don't crash!</p>
    <div class="nickrow"><input id="nick" type="text" maxlength="12" placeholder="Your nickname" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Your nickname"><button id="reroll" class="mini" aria-label="Random name">🎲</button></div>
    <div id="nickMsg" class="nickmsg">Tip: don't use your real name!</div>
    <button id="play1" class="btn b1">▶ 1 Player</button>
    <button id="play2" class="btn b2">👫 2 Players<small>same phone, split screen</small></button>
    <div class="board"><h3>🏆 Top scores on this phone</h3><ol id="topList"></ol></div>
    <p class="hint">Keyboard: Space = jump · 2 players: A and L</p>
  </div>
</div>

<div id="over" class="screen hidden">
  <div class="card">
    <h2 id="overTitle"></h2>
    <div id="overBody"></div>
    <button id="again" class="btn b1">↻ Play again</button>
    <button id="toMenu" class="btn b3">☰ Menu</button>
  </div>
</div>

<script src="js/game.js" defer></script>
</body>
</html>
